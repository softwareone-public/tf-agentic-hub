name: Terraform dependency update (orchestrator)

# Fans out one run of the agentic worker workflow (terraform-dependency-update)
# per repository listed in config/targets.json.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      allow_major_upgrades:
        description: "Allow major version upgrades of Terraform modules."
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: terraform-dependency-orchestrator
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch worker runs
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: config/targets.json
          sparse-checkout-cone-mode: false

      - name: Dispatch worker for every target repository
        env:
          GH_TOKEN: ${{ github.token }}
          ALLOW_MAJOR_UPGRADES: ${{ github.event_name != 'workflow_dispatch' || inputs.allow_major_upgrades }}
        run: |
          set -euo pipefail
          jq -r '.repositories[]' config/targets.json | while read -r repo; do
            echo "Dispatching terraform-dependency-update for ${repo}"
            gh workflow run terraform-dependency-update.lock.yml \
              --repo "${GITHUB_REPOSITORY}" \
              --ref "${GITHUB_REF_NAME}" \
              -f target_repo="${repo}" \
              -f allow_major_upgrades="${ALLOW_MAJOR_UPGRADES}"
            echo "- \`${repo}\`" >> "${GITHUB_STEP_SUMMARY}"
          done
